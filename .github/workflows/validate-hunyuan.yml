name: Validate Hunyuan integration
on:
  pull_request:
    paths:
      - 'src/lib/hunyuan3d-client.ts'
      - 'src/lib/hunyuan3d-client.test.ts'
      - '.github/workflows/validate-hunyuan.yml'
  push:
    branches: [feature/hunyuan3d-adapter]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test -- --run src/lib/hunyuan3d-client.test.ts
      - run: npm run build
